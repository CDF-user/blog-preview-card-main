<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Blog preview card</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
<main>
  <section class="header">
    <article class="card-container">
      <img src="assets/images/illustration-article.svg" type="image/svg" alt="blog card's illustration">
      <div class="card-categorie">Learning</div>
      <p class="publication-date">Published 21 Dec 2023</p>
        <div class="card-content">
          <h1>HTML & CSS foundations</h1>
          <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>
        </div>
      <img src="assets/images/image-avatar.webp" type="image-avatar/webp" alt="Avatar's blog creator">
      <p>Greg Hooper</p>
      </div>
    </article>
  </section>  
</main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">CDF</a>.
  </footer>
</body>

</html>
